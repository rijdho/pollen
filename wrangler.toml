name = "pollen"
main = "worker/src/index.js"
# Pinned to a date the wrangler in devDependencies can actually run locally, so
# the runtime that passes `npm run live` is the runtime that gets deployed.
# Raising it means checking `npm run dev` still starts, not just editing this
# line. Everything this Worker depends on is older: SQLite-backed Durable
# Objects, and the navigation-request behaviour for static assets (2025-04-01).
compatibility_date = "2026-09-09"

# Never on the workers.dev namespace: that hostname publishes the account
# namespace, and private workers live on it under guessable names.
workers_dev = false
routes = [
  { pattern = "pollen.rijdho.org", custom_domain = true }
]

# The app is served by the platform, not by the Worker. Static asset requests
# are free and unlimited and, from compatibility date 2025-04-01, a navigation
# request does not invoke the script at all, so typing pollen.rijdho.org/K7RM2Q
# costs nothing. Only /api/* wakes the Worker, and only that is billed.
[assets]
directory = "public"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "THROTTLE"
class_name = "Throttle"

# SQLite is the only storage backend available on the Workers free plan, and
# the one Cloudflare recommends for all new classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Throttle"]

[observability]
enabled = true
